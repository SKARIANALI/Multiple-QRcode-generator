kind = "web"
previewPath = "/"
title = "Offline UPI QR"
description = "A mobile-first offline Progressive Web App that creates exact UPI payment QR codes, stores sessions locally, and helps users access their QR history without claiming payment confirmation."
version = "1.0.0"
id = "artifacts/offline-upi-qr"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26057

[services.development]
run = "pnpm --filter @workspace/offline-upi-qr run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/offline-upi-qr", "run", "build" ]
serve = "static"
publicDir = "artifacts/offline-upi-qr/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26057"
BASE_PATH = "/"
